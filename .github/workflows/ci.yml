name: Notifier CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r notifier/requirements.txt pytest
    - name: Run unit tests
      env:
        PYTHONPATH: ./notifier
      run: |
        pytest notifier/src/infrastructure/notifiers/tests/ -v