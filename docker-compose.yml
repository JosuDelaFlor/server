services:
  minecraft:
    image: itzg/minecraft-server
    container_name: mc-server
    environment:
      EULA: "TRUE"
      MEMORY: "4G"
      TYPE: "PAPER"
      VERSION: "1.20.1"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-supersecreto}"
      RCON_PORT: "25575"
    expose:
      - "25565"
    volumes:
      - ./mc-data:/data
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mc-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: "tcp minecraft:25565 --config=/etc/ngrok.yml --log=stdout"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    depends_on:
      - minecraft
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4040/api/tunnels"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notifier:
    build: ./notifier
    container_name: mc-notifier
    environment:
      NGROK_API_URL: "http://ngrok:4040/api/tunnels"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      CHECK_INTERVAL: "10"
    depends_on:
      - ngrok
    restart: unless-stopped

  backups:
    image: itzg/mc-backup
    container_name: mc-backups
    environment:
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: "7"
    volumes:
      - ./mc-data:/data:ro
      - ./mc-backups:/backups
    restart: unless-stopped

  dashboard-api:
    build: ./dashboard-api
    container_name: mc-dashboard-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - RCON_HOST=minecraft
      - RCON_PORT=25575
      - RCON_PASSWORD=${RCON_PASSWORD:-supersecreto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./mc-data:/server-data
    depends_on:
      - minecraft
    restart: unless-stopped